<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Preisjäger">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a7d55">
<link rel="apple-touch-icon" href="/symbol-180.png">
<link rel="manifest" href="/manifest.json">
<meta name="author" content="Tekin Kaplan">
<title>TK Preisjäger</title>
<style>
:root{--bg:#f3f5f7;--karte:#fff;--karte2:#f8fafb;--text:#101a23;--leise:#5b6875;--linie:#e1e6eb;--akzent:#0a7d55;--akzent-t:#fff;--akzent2:#e4f5ee;--warn:#9a5a00;--warn2:#fff4e0;--rot:#b3261e;--schatten:0 1px 2px rgba(16,26,35,.06),0 4px 14px rgba(16,26,35,.05);
--Kleinanzeigen:#2f8f2f;--Vinted:#007782;--Shpock:#2bb673;--Hood:#d2452f;--rebuy:#1d6fd8;--Amazon:#e47911;--idealo:#0a3761;--MediaMarkt:#df0000;--Saturn:#e8590c;--Web:#6b4fbb}
@media (prefers-color-scheme:dark){:root{--bg:#0d1216;--karte:#161d23;--karte2:#1b242b;--text:#e9eef2;--leise:#96a3af;--linie:#27323b;--akzent:#3fcf9b;--akzent-t:#04241a;--akzent2:#12302a;--warn:#ffb95c;--warn2:#2f2410;--rot:#ff8a80;--schatten:0 1px 2px rgba(0,0,0,.4);
--Kleinanzeigen:#6fd06f;--Vinted:#35c4cf;--Shpock:#5fdc9f;--Hood:#ff8f7c;--rebuy:#7fb2ff;--Amazon:#ffa94d;--idealo:#8fb8e8;--MediaMarkt:#ff7b7b;--Saturn:#ff9a5c;--Web:#b9a4ff}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--linie)}
.kopf{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;gap:14px;align-items:center}
.marke{display:flex;gap:10px;align-items:center;font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.zeichen{width:32px;height:32px;border-radius:9px;background:var(--akzent);color:var(--akzent-t);display:grid;place-items:center;font-weight:800;font-size:18px}
form{flex:1;display:flex;gap:8px;min-width:0}
.feld{flex:1;position:relative;min-width:0}
.feld svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--leise)}
input[type=search]{width:100%;font:inherit;font-size:16px;padding:11px 14px 11px 42px;border:1.5px solid var(--linie);border-radius:12px;background:var(--karte);color:var(--text);outline:none;box-shadow:var(--schatten)}
input[type=search]:focus{border-color:var(--akzent)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--linie);background:var(--karte);color:var(--text);padding:7px 12px}
button:hover{border-color:var(--akzent)}
.haupt{background:var(--akzent);border-color:var(--akzent);color:var(--akzent-t);font-weight:650;padding:0 22px;border-radius:12px;font-size:15.5px}
main{max-width:1120px;margin:0 auto;padding:18px 20px 70px}
.leise{color:var(--leise)}
.klein{font-size:13px}
/* Quellenleiste */
.quellen{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:2px 0 4px}
.q{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 10px;border-radius:99px;background:var(--karte);border:1px solid var(--linie);font-size:13.5px;font-weight:600;box-shadow:var(--schatten)}
.q i{width:9px;height:9px;border-radius:50%;background:var(--f);flex:none}
.q .n{font-weight:500;color:var(--leise)}
.q.aus{opacity:.45}
.q.wahl{border-color:var(--f);box-shadow:0 0 0 1.5px var(--f)}
.q.lauf i{animation:puls 1s ease-in-out infinite}
.q.fehl .n{color:var(--rot)}
@keyframes puls{50%{opacity:.25;transform:scale(.7)}}
/* Start */
.start{text-align:center;padding:56px 10px 20px}
.start h1{font-size:34px;letter-spacing:-.02em;margin:0 0 8px}
.start p{max-width:620px;margin:0 auto 22px;color:var(--leise);font-size:16.5px}
.bsp{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.schritte{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:38px auto 0;max-width:900px;text-align:left}
.schritt{background:var(--karte);border:1px solid var(--linie);border-radius:14px;padding:16px;box-shadow:var(--schatten)}
.schritt b{display:block;margin-bottom:4px}
/* Kennzahlen */
.zahlen{display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:12px;margin:16px 0}
.zahl{background:var(--karte);border:1px solid var(--linie);border-radius:14px;padding:14px 16px;box-shadow:var(--schatten);min-width:0;text-decoration:none;display:block}
.zahl .w{font-size:24px;font-weight:750;letter-spacing:-.02em;margin-top:2px;white-space:nowrap}
.zahl.best{background:var(--akzent2);border-color:var(--akzent)}
.zahl.best .w{font-size:34px;color:var(--akzent)}
.zahl .u{font-size:12.5px;color:var(--leise);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.zahl:hover{border-color:var(--akzent)}
/* Leiste über der Liste */
.leiste{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:18px 0 10px}
.leiste h2{font-size:17px;margin:0}
.wahlen{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:inline-flex;background:var(--karte);border:1px solid var(--linie);border-radius:10px;overflow:hidden}
.seg label{padding:6px 11px;font-size:13.5px;cursor:pointer;border-right:1px solid var(--linie);user-select:none}
.seg label:last-child{border-right:0}
.seg input{display:none}
.seg label:has(input:checked){background:var(--akzent2);color:var(--akzent);font-weight:650}
select{font:inherit;font-size:13.5px;padding:6px 8px;border-radius:10px;border:1px solid var(--linie);background:var(--karte);color:var(--text)}
/* Angebot */
.a{display:grid;grid-template-columns:28px 92px 1fr auto;gap:14px;align-items:center;background:var(--karte);border:1px solid var(--linie);border-radius:14px;padding:10px 16px 10px 8px;margin-bottom:8px;text-decoration:none;box-shadow:var(--schatten);transition:border-color .12s,transform .12s}
.a:hover{border-color:var(--akzent);transform:translateY(-1px)}
.a .nr{text-align:center;color:var(--leise);font-size:13px;font-variant-numeric:tabular-nums}
.a img,.a .ohne{width:92px;height:92px;object-fit:cover;border-radius:10px;background:var(--karte2);display:block}
.a .ohne{display:grid;place-items:center;color:var(--leise);font-size:22px}
.a .t{font-weight:600;font-size:15.5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.a .z{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.a .i{margin-top:5px;font-size:13px;color:var(--leise)}
.a .p{text-align:right;white-space:nowrap}
.a .p b{font-size:23px;letter-spacing:-.02em;display:block}
.a .p span{font-size:12.5px;color:var(--leise)}
.a .p .spar{color:var(--akzent);font-weight:650}
.m{display:inline-flex;align-items:center;gap:5px;font-size:12px;border-radius:6px;padding:2px 8px;background:var(--karte2);border:1px solid var(--linie);color:var(--leise);font-weight:550}
.m.qq{color:var(--f);border-color:color-mix(in srgb,var(--f) 45%,transparent)}
.m.qq i{width:7px;height:7px;border-radius:50%;background:var(--f)}
.m.neu{color:var(--akzent);border-color:var(--akzent)}
.m.defekt,.m.fehlt{color:var(--warn);border-color:var(--warn)}
.kasten{background:var(--karte);border:1px solid var(--linie);border-radius:14px;padding:14px 16px;margin-top:12px;box-shadow:var(--schatten)}
.kasten.warn{background:var(--warn2);border-color:var(--warn)}
details summary{cursor:pointer;font-weight:650}
details[open] summary{margin-bottom:12px}
.chip{border-radius:99px;padding:5px 12px;font-size:13.5px;background:var(--karte)}
.chip .x{margin-left:6px;color:var(--leise)}
.links a{display:inline-block;margin:8px 8px 0 0;padding:7px 13px;border:1px solid var(--linie);border-radius:99px;text-decoration:none;font-weight:550;font-size:13.5px;background:var(--karte2)}
.links a:hover{border-color:var(--akzent)}
.merk{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.mehr{display:block;margin:10px auto 0}
footer{margin-top:40px;color:var(--leise);font-size:12.5px;text-align:center}
.handeln{margin-top:6px;font-size:12.5px;padding:4px 10px;border-radius:8px;border-color:var(--akzent);color:var(--akzent);font-weight:650;background:transparent}
.handeln:hover{background:var(--akzent2)}
.ueber{color:var(--warn);font-weight:600}
dialog{border:1px solid var(--linie);border-radius:16px;background:var(--karte);color:var(--text);padding:0;width:min(640px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,12,16,.55)}
.dl{padding:20px 22px}
.dl h3{margin:0 0 4px;font-size:18px}
.dl textarea{width:100%;font:inherit;border:1.5px solid var(--linie);border-radius:10px;padding:10px 12px;background:var(--karte2);color:var(--text);resize:vertical;outline:none}
.dl textarea:focus,.zahlfeld:focus{border-color:var(--akzent)}
.zahlfeld{font:inherit;width:110px;padding:6px 10px;border:1.5px solid var(--linie);border-radius:10px;background:var(--karte);color:var(--text);outline:none}
.reihe{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.hv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--linie)}
.hv:first-of-type{border-top:0}
.vglk{margin-top:6px;margin-left:4px;font-size:12.5px;padding:4px 10px;border-radius:8px;background:transparent}
.vglk.an{background:var(--akzent);border-color:var(--akzent);color:var(--akzent-t);font-weight:650}
#korb{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--karte);border-top:1px solid var(--linie);box-shadow:0 -6px 24px rgba(0,0,0,.18);display:none}
#korb .in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#korb input{font:inherit;padding:7px 10px;border:1.5px solid var(--linie);border-radius:10px;background:var(--karte2);color:var(--text);min-width:220px;flex:1;outline:none}
#vdlg{width:min(1180px,96vw)}
.vg{display:grid;gap:12px;margin-top:14px}
.vp{border:1px solid var(--linie);border-radius:14px;padding:14px;background:var(--karte2);min-width:0}
.vp.sieger{border-color:var(--akzent);box-shadow:0 0 0 1.5px var(--akzent)}
.vp h4{margin:0 0 2px;font-size:15.5px}
.vp h5{margin:12px 0 4px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--leise)}
.vp ul{margin:0;padding:0;list-style:none}
.vp li{padding:2px 0 2px 20px;position:relative;font-size:14px}
.vp li::before{position:absolute;left:0;font-weight:700}
.vp .ja li::before{content:"✓";color:var(--akzent)}
.vp .nein li::before{content:"✕";color:var(--rot)}
.vp .pl li::before{content:"+";color:var(--akzent)}
.vp .mi li::before{content:"–";color:var(--warn)}
.vp .un li::before{content:"?";color:var(--leise)}
.empf{background:var(--akzent2);border:1.5px solid var(--akzent);border-radius:14px;padding:14px 16px;margin-top:12px}
@media (max-width:900px){.vg{grid-template-columns:1fr !important}}
.abwurf{border:2px dashed var(--linie);border-radius:16px;padding:30px 20px;text-align:center;background:var(--karte);cursor:pointer}
.abwurf.drueber{border-color:var(--akzent);background:var(--akzent2)}
.fotos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fotos img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--linie)}
.vkfeld{width:100%;font:inherit;border:1.5px solid var(--linie);border-radius:10px;padding:9px 12px;background:var(--karte2);color:var(--text);outline:none}
.vkfeld:focus{border-color:var(--akzent)}
#update{display:none;position:sticky;top:0;z-index:7;background:var(--akzent);color:var(--akzent-t);padding:9px 16px;text-align:center;font-weight:600}
#update button{margin-left:10px;background:var(--akzent-t);color:var(--akzent);border:0;font-weight:700;padding:5px 12px}
header{padding-top:env(safe-area-inset-top)}
main{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
.knoepfe{display:flex;gap:8px}
@media (max-width:820px){.kopf{flex-wrap:wrap;gap:8px}.kopf form{order:2;flex:1 1 100%}.knoepfe{order:3;flex:1 1 100%;overflow-x:auto;-webkit-overflow-scrolling:touch}.knoepfe button{flex:1;white-space:nowrap;padding:9px 10px}
  .leiste{flex-direction:column;align-items:stretch}.wahlen{gap:8px}.a .p button{display:inline-block;margin:6px 0 0 4px}
  .zahlen{grid-template-columns:1fr 1fr !important}.vg{grid-template-columns:1fr !important}
  dialog{width:100vw;max-width:100vw;max-height:100dvh;height:100dvh;margin:0;border-radius:0;border:0}#korb .in{padding:8px 12px}
  input,select,textarea{font-size:16px !important}
  .quellen{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}.quellen .q,.quellen span{flex:none;white-space:nowrap}}
@media (max-width:560px){.a{grid-template-columns:64px 1fr !important}.a .p{grid-column:1/-1;text-align:left;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.a .p b{font-size:21px;margin-right:6px}.a .p br{display:none}}
.skel{height:112px;border-radius:14px;margin-bottom:8px;background:linear-gradient(90deg,var(--karte) 25%,var(--karte2) 50%,var(--karte) 75%);background-size:200% 100%;animation:sk 1.2s linear infinite;border:1px solid var(--linie)}
@keyframes d{to{transform:rotate(360deg)}}
@keyframes sk{to{background-position:-200% 0}}
@media (max-width:820px){.zahlen{grid-template-columns:1fr 1fr}.zahl.best{grid-column:1/-1}.schritte{grid-template-columns:1fr}.marke span{display:none}}
@media (max-width:560px){.a{grid-template-columns:64px 1fr auto;padding-left:10px}.a .nr{display:none}.a img,.a .ohne{width:64px;height:64px}.a .p b{font-size:19px}.kopf{padding:10px 12px}main{padding:14px 12px 60px}.haupt{padding:0 14px}.start h1{font-size:26px}}

.dkopf{position:sticky;top:0;z-index:3;display:flex;justify-content:flex-end;gap:8px;padding:8px 12px;background:var(--karte);border-bottom:1px solid var(--linie)}
.dkopf button{padding:7px 14px;font-weight:600}
.hoch{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:9;width:48px;height:48px;border-radius:50%;border:0;background:var(--akzent);color:var(--akzent-t);font-size:22px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.35);display:none;padding:0}
.hoch.da{display:block}
dialog{overflow-x:hidden}
@media (max-width:820px){.dkopf{padding-top:calc(8px + env(safe-area-inset-top))}.dl{padding:14px 14px calc(80px + env(safe-area-inset-bottom))}.dl .vkfeld{min-width:0 !important}.dl img{max-width:100%}
  .snk{grid-template-columns:1fr !important;gap:8px !important}.snk>img{width:100% !important;height:110px !important}.snp{text-align:left !important;white-space:normal !important}.snk .z span{white-space:nowrap}}
</style>
</head>
<body>
<div id="update"></div>
<header><div class="kopf">
<div class="marke"><div class="zeichen">€</div><span>TK Preisjäger</span></div>
<form id="f"><div class="feld"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
<input id="q" type="search" placeholder="Produkt oder Wunsch, z. B. „Wasserspender mit Sprudel bis 900 €“" autofocus autocomplete="off"></div>
<button class="haupt">Suchen</button></form>
<div class="knoepfe"><button id="vglauf" title="Produkte vergleichen: Vorteile, Nachteile, Empfehlung">Vergleichen</button>
<button id="snap" title="Angebote weit unter Marktpreis – mit Gewinnrechnung für den Weiterverkauf" style="border-color:var(--akzent);color:var(--akzent);font-weight:650">Schnäppchen</button>
<button id="vkauf" title="Eigene Artikel verkaufen: Fotos hochladen, Text und Preis vorschlagen lassen, einstellen">Verkaufen</button></div>
</div></header>
<main>
<div class="quellen" id="quellen"></div>
<div class="reihe" id="abhol" style="margin-top:6px"></div>
<div class="merk" id="merk"></div>
<div id="auto"></div>
<div id="handel"></div>
<div id="aus"></div>
<dialog id="dlg"><div class="dkopf"><button data-anfang="1">↑ Anfang</button><button data-dzu="1">✕ Schließen</button></div><div class="dl" id="dl"></div><button class="hoch" data-anfang="1" aria-label="Nach oben">↑</button></dialog>
<dialog id="vdlg"><div class="dkopf"><button data-anfang="1">↑ Anfang</button><button data-dzu="1">✕ Schließen</button></div><div class="dl" id="vdl"></div><button class="hoch" data-anfang="1" aria-label="Nach oben">↑</button></dialog>
<button class="hoch" id="hoch" aria-label="Nach oben">↑</button>
<div id="korb"><div class="in" id="korbin"></div></div>
<footer>TK Preisjäger {{FASSUNG}} · Bau {{BAU}} · © 2026 Tekin Kaplan</footer>
</main>
<script>
// Fehler in der Oberfläche an den Server melden (steht dann im Protokoll des Dienstes) – so lassen sie sich aus der Ferne finden
window.addEventListener('error',e=>{ try{ fetch('/api/fehler',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:String(e.message)+' @'+(e.lineno||'')+':'+(e.colno||'')})}); }catch(x){} });
window.addEventListener('unhandledrejection',e=>{ try{ fetch('/api/fehler',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:'Promise: '+String(e.reason)})}); }catch(x){} });
// Update-Hinweis: Nach jedem Einspielen zählt die Baunummer auf dem Server hoch – die offene App merkt das und bietet das Neuladen an
const GELADEN={fassung:'{{FASSUNG}}',bau:'{{BAU}}'};
async function updatepruefen(){ try{ const s=await (await fetch('/api/stand',{cache:'no-store'})).json(); if(String(s.bau)!==GELADEN.bau||s.fassung!==GELADEN.fassung){ const u=document.getElementById('update');
  u.innerHTML='Neues Update verfügbar: Fassung '+s.fassung+' (Bau '+s.bau+')'+(s.neues?' – '+s.neues.replace(/[<>&]/g,''):'')+' <button onclick="location.reload()">Jetzt aktualisieren</button>'; u.style.display='block'; } }catch(e){} }
setInterval(updatepruefen,60000); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) updatepruefen(); });
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>n.toLocaleString('de-DE',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})+' €';
const QUELLEN=['Kleinanzeigen','Vinted','Shpock','Hood','rebuy','Amazon','idealo','MediaMarkt','Saturn','Web'];
const QNAME={Web:'Weitere Händler',idealo:'idealo-Händler'};
const VERTRAUEN={bekannt:'bekannter Händler',idealo:'bei idealo gelistet',hersteller:'Herstellershop',unbekannt:'unbekannter Shop – nicht geprüft'};
const ZU={neu:'Neu',aufbereitet:'Geprüft',gebraucht:'Gebraucht',defekt:'Defekt'};
const BSP=['iPhone 13 128GB','Sony WH-1000XM5','Ich brauche ein Cube Kinderfahrrad 24 Zoll mit Licht, nicht teurer als 250','Wasserspender, der sprudeln kann und heißes Wasser macht, für höchstens 900 €'];
let stand=null, nurQuelle=null, zeigeAnzahl=40, laeuft=false;
const wahl={neu:true,aufbereitet:true,gebraucht:true}; let streng=true, sortierung='auf', meinPreis=null, reg=[], akt=null;

let abhol={an:false,plz:'',km:30}; try{ abhol=Object.assign(abhol,JSON.parse(localStorage.getItem('abhol')||'{}')); }catch(e){}
function abholzeile(){
  $('#abhol').innerHTML=`<label class="q" style="cursor:pointer;--f:var(--akzent)"><input type="checkbox" id="aban" ${abhol.an?'checked':''} style="margin:0 4px 0 0">Nur Abholung in meiner Nähe</label>
  <label class="klein leise">PLZ <input class="zahlfeld" id="abplz" inputmode="numeric" maxlength="5" placeholder="z. B. 44137" value="${esc(abhol.plz)}" style="width:92px;padding:5px 8px"></label>

  if(ausVergleich) vglHtml=$('#vdl').innerHTML;
  const zurueck=ausVergleich?'<button data-vback="1">← Zurück zum Vergleich</button>':'';
  $('#vdl').innerHTML=`<h3>${esc(a.titel)}</h3><div class="leise">Lese die Angebotsseite und stelle Eigenschaften und Ausstattung zusammen … (etwa 10–20 Sekunden)</div><div class="skel" style="margin-top:14px"></div>`;
  $('#vdlg').showModal();
  let d; try{ d=await post('/api/details',{titel:a.titel,url:a.url,preis:a.preis,quelle:a.quelle}); }catch(e){ d={fehler:'Der Preisjäger ist gerade nicht erreichbar.'}; }
  if(d.fehler){ $('#vdl').innerHTML=`<h3>${esc(a.titel)}</h3><div class="kasten warn">${esc(d.fehler)}</div><div class="reihe" style="justify-content:flex-end">${zurueck}<button data-vzu="1">Schließen</button></div>`; return; }
  const li=(l,k)=>`<ul class="${k}">${l.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  const i=reg.indexOf(a);
  $('#vdl').innerHTML=`<div style="display:flex;gap:16px;align-items:flex-start">${a.bild?`<img src="${esc(a.bild)}" referrerpolicy="no-referrer" style="width:130px;height:130px;object-fit:cover;border-radius:12px" onerror="this.remove()">`:''}
  <div style="min-width:0;flex:1"><h3>${esc(d.produkt)}</h3><div class="leise klein">${esc(a.titel)}</div>
  <div style="margin-top:6px"><span class="m qq" style="--f:var(--${esc(a.quelle)})"><i></i>${esc(a.quelle)}</span> ${a.zustand?`<span class="m ${a.zustand}">${ZU[a.zustand]||''}</span>`:''} <b style="font-size:22px;margin-left:8px">${a.preis?eur(a.preis):''}</b></div>
  <div style="margin-top:8px">${esc(d.kurz)}</div></div></div>
  <div class="vg" style="grid-template-columns:1fr 1fr"><div class="vp"><h5 style="margin-top:0">Eigenschaften</h5>${d.eigenschaften.length?`<table style="border-collapse:collapse;font-size:14px;width:100%">${d.eigenschaften.map(([k,w])=>`<tr><td style="padding:3px 12px 3px 0;color:var(--leise);vertical-align:top;white-space:nowrap">${esc(k)}</td><td style="padding:3px 0">${esc(w)}</td></tr>`).join('')}</table>`:'<div class="leise klein">keine Angaben</div>'}</div>
  <div class="vp"><h5 style="margin-top:0">Ausstattung</h5>${d.ausstattung.length?li(d.ausstattung,'ja'):'<div class="leise klein">keine Angaben</div>'}${d.lieferumfang.length?`<h5>Lieferumfang</h5>${li(d.lieferumfang,'pl')}`:''}${d.zu_diesem_angebot.length?`<h5>Zu diesem Angebot</h5>${li(d.zu_diesem_angebot,'mi')}`:''}${d.unsicher.length?`<h5>Nicht sicher</h5>${li(d.unsicher,'un')}`:''}</div></div>
  ${d.anbietertext?`<div class="vp" style="margin-top:12px"><h5 style="margin-top:0">Text des Anbieters (Original)</h5>${d.verkaeufer?`<div class="klein leise" style="margin-bottom:8px">Verkäufer: ${esc(d.verkaeufer)}</div>`:''}<div style="white-space:pre-wrap;font-size:14px;max-height:320px;overflow:auto">${esc(d.anbietertext)}</div></div>`:`<div class="klein leise" style="margin-top:10px">Der Originaltext des Anbieters ließ sich von dieser Seite nicht lesen – über „Angebot öffnen“ ansehen.</div>`}
  ${(d.warn||[]).length?`<div class="kasten warn" style="border-color:var(--rot)"><b style="color:var(--rot)">⚠ Warnzeichen in dieser Anzeige</b><ul class="mi" style="margin:6px 0 0;padding-left:18px">${d.warn.map(w=>`<li>${esc(w)}</li>`).join('')}</ul><div class="klein leise" style="margin-top:6px">Ein Hinweis, kein Beweis. Sicher sind: Abholung mit Barzahlung nach Prüfung oder „Sicher bezahlen“ in der App.</div></div>`:''}
  <div class="leise klein" style="margin-top:10px">${d.belegt?'Grundlage: Angaben von der Angebotsseite, ergänzt durch KI-Wissen über das Modell.':'Die Angebotsseite war nicht lesbar – Angaben stammen nur aus KI-Wissen über das Modell.'} Angaben können falsch sein; vor dem Kauf die Anzeige prüfen.</div>
  <div class="reihe" style="justify-content:flex-end"><a href="${esc(a.url)}" target="_blank" rel="noopener"><button>Angebot öffnen ↗</button></a>${a.art==='privat'&&a.zustand!=='defekt'&&i>=0?`<button data-dh="${i}">Verhandeln</button>`:''}${i>=0?`<button data-dv="${i}">+ Vergleich</button>`:''}${zurueck}<button data-vzu="1">Schließen</button></div>`;
}
document.addEventListener('keydown',e=>{ if(e.target.id==='snq'&&e.key==='Enter'){ e.preventDefault(); $('#snstart').click(); } });
document.addEventListener('keydown',e=>{ if(e.target.id==='korbneu'&&e.key==='Enter'){ e.preventDefault(); if(korbeingabe()){ korbzeigen(); $('#korbneu').focus(); } else if(korb.length) vergleichen(); } });
document.addEventListener('click',e=>{
  const v=e.target.closest('[data-vgl]'); if(v){ e.preventDefault(); e.stopPropagation(); const a=reg[+v.dataset.vgl], i=korb.findIndex(k=>k.url===a.url);
    if(i>=0) korb.splice(i,1); else if(korb.length<4) korb.push(korbeintrag(a)); zeigen(); korbzeigen(); return; }
  const vd=e.target.closest('[data-vdet]'); if(vd&&vglDaten){ const p=vglDaten.produkte[+vd.dataset.vdet]; if(p){ const q=Object.entries(QUELLE_VON).find(([k])=>(p.url||'').includes(k)); details({titel:p.name,url:p.url||'',preis:p.bester||0,quelle:q?q[1]:'idealo',zustand:'',bild:'',art:''},true); } return; }
  if(e.target.dataset.vback){ $('#vdl').innerHTML=vglHtml; return; }
  const de=e.target.closest('[data-det]'); if(de){ e.preventDefault(); e.stopPropagation(); details(reg[+de.dataset.det]); return; }
  if(e.target.dataset.dh){ $('#vdlg').close(); handeln(reg[+e.target.dataset.dh]); return; }
  if(e.target.dataset.dv){ const a=reg[+e.target.dataset.dv]; if(korb.length<4&&!korb.some(k=>k.url===a.url)) korb.push(korbeintrag(a)); $('#vdlg').close(); zeigen(); korbzeigen(); return; }
  const kw=e.target.closest('[data-korbweg]'); if(kw){ korb.splice(+kw.dataset.korbweg,1); if(stand) zeigen(); korbzeigen(); return; }
  if(e.target.id==='vglauf'){ korbOffen=true; if(!korb.length&&stand&&(stand.produkt||stand.anfrage)) korb.push({name:stand.produkt||stand.anfrage}); korbzeigen(); $('#korbneu').focus(); return; }
  if(e.target.id==='korbdazu'){ if(korbeingabe()) korbzeigen(); $('#korbneu').focus(); return; }
  if(e.target.id==='korbzu'){ korbOffen=false; korb=[]; if(stand) zeigen(); korbzeigen(); return; }
  if(e.target.id==='vglstart'){ vergleichen(); return; }
  if(e.target.dataset.vzu||e.target===$('#vdlg')){ $('#vdlg').close(); return; }
  if(e.target.closest('#vdlg [data-q]')) $('#vdlg').close();
},true);
// ---------- Verhandeln ----------
let verhandlungen=[];
async function post(pfad,daten){ const r=await fetch(pfad,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(daten)}); return r.json(); }
function kopieren(text){ const t=document.createElement('textarea'); t.value=text; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} t.remove(); if(!ok&&navigator.clipboard) navigator.clipboard.writeText(text).catch(()=>{}); }
async function handelsliste(l){
  try{ verhandlungen=Array.isArray(l)?l:await (await fetch('/api/verhandlungen')).json(); }catch(e){ verhandlungen=[]; }
  $('#handel').innerHTML=verhandlungen.length?`<details class="kasten" ${verhandlungen.length<4?'open':''}><summary>Meine Verhandlungen (${verhandlungen.length})</summary>${verhandlungen.map((x,i)=>`<div class="hv" data-hv="${i}"><div style="min-width:0;cursor:pointer"><b>${esc(x.titel)}</b><div class="leise klein">${esc(x.quelle)} · Verkäufer ${eur(x.preis)} → mein Preis ${eur(x.mein)} · <b>${esc(x.stand)}</b> · ${esc(x.zeit)}</div></div><div><button>Weiter</button> <button data-fort="1" title="Aus der Liste nehmen">✕</button></div></div>`).join('')}</details>`:'';
}
let autoDaten=[];
async function autoliste(l){
  try{ autoDaten=Array.isArray(l)?l:await (await fetch('/api/auto')).json(); }catch(e){ return; }
  const offen=autoDaten.filter(x=>['wartet','gesendet','verhandelt','einig','rueckfrage'].includes(x.stand)).length;
  $('#auto').innerHTML=autoDaten.length?`<details class="kasten" style="border-color:var(--akzent)" ${offen?'open':''}><summary>Selbstständige Verhandlungen (${offen} laufend, ${autoDaten.length} gesamt)</summary>${autoDaten.slice(0,30).map((x,i)=>`<div class="hv" style="grid-template-columns:1fr"><div><b>${esc(x.titel)}</b> <span class="m ${x.stand==='einig'?'neu':['betrug','fehler','rueckfrage'].includes(x.stand)?'fehlt':''}">${esc(x.standtext)}</span>
    <div class="leise klein">${esc(x.verkaeufer||'Verkäufer')} · Preis ${eur(x.preis)} → mein Preis ${eur(x.mein)} · ${x.weg==='versand'?'Versand, PayPal':'Abholung, bar'} · Gegenrunden ${x.runden} · zuletzt ${esc(x.geaendert)}</div>
    ${x.hinweis?`<div class="klein" style="color:var(--warn)">${esc(x.hinweis)}</div>`:''}
    <details style="margin-top:6px"><summary class="klein">Verlauf (${x.verlauf.length})</summary>${x.verlauf.map(m=>`<div class="klein" style="margin:6px 0;padding:6px 10px;border-radius:10px;background:${m.von==='ich'?'var(--akzent2)':'var(--karte2)'}"><b>${m.von==='ich'?'Ich (App)':esc(x.verkaeufer||'Verkäufer')}</b> · ${esc(m.zeit)}<br>${esc(m.text)}</div>`).join('')||'<div class="klein leise">noch nichts</div>'}</details>
    <div class="reihe"><a href="${esc(x.url)}" target="_blank" rel="noopener"><button>Anzeige öffnen ↗</button></a>${['rueckfrage','einig','verhandelt','gesendet'].includes(x.stand)?`<input class="zahlfeld" style="flex:1;min-width:200px;width:auto" id="aa${i}" placeholder="Eigene Antwort an den Verkäufer …"><button data-aantw="${i}">Senden</button>`:''}${['wartet','gesendet','verhandelt','rueckfrage'].includes(x.stand)?`<button data-astop="${i}">Stoppen</button>`:''}</div></div></div>`).join('')}</details>`:'';
}
document.addEventListener('click',async e=>{
  if(e.target.dataset.astop){ autoliste(await post('/api/auto/stop',{id:autoDaten[+e.target.dataset.astop].id})); }
  if(e.target.dataset.aantw){ const i=+e.target.dataset.aantw, t=($('#aa'+i)||{}).value||''; if(t.trim().length<2) return; const d=await post('/api/auto/antwort',{id:autoDaten[i].id,text:t}); if(!d.fehler) autoliste(d); }
});
setInterval(()=>{ if(autoDaten.some(x=>['wartet','gesendet','verhandelt','rueckfrage','einig','abgelehnt','festgefahren'].includes(x.stand))&&!document.querySelector('#auto input:focus')) autoliste(); },30000);
async function entwurf(){
  const m=parseFloat($('#hp').value); if(!m){ $('#hp').focus(); return; } meinPreis=m; akt.mein=m;
  const weg=$('#hweg').value; akt.weg=weg;
  $('#hgeb').textContent=weg==='versand'?'PayPal „Waren und Dienstleistungen“: Die Gebühr liegt bei ungefähr '+eur(Math.round((m*0.0249+0.35)*100)/100)+' (rund 2,49 % + 0,35 € – den aktuellen Satz bitte bei PayPal prüfen). Dazu kommt der Versand.':'';
  $('#ht').value='Schreibe …'; const d=await post('/api/nachricht',{titel:akt.a.titel,preis:akt.a.preis,mein:m,quelle:akt.a.quelle,weg}); $('#ht').value=d.text||d.fehler||'';
}
function handeln(a,alt){
  akt={a,mein:alt?alt.mein:meinPreis};
  $('#dl').innerHTML=`<h3>Verhandeln</h3><div class="leise">${esc(a.titel)}</div>
  <div class="reihe"><span class="m qq" style="--f:var(--${esc(a.quelle)})"><i></i>${esc(a.quelle)}</span><span>Verkäufer will <b>${eur(a.preis)}</b></span><label>· Mein Preis <input class="zahlfeld" id="hp" type="number" min="1" step="1" value="${akt.mein||''}" placeholder="€"></label><label>· <select id="hweg"><option value="abholung">Abholung, bar</option><option value="versand"${a.fern?' selected':''}>Versand, PayPal mit Käuferschutz (Gebühr zahle ich)</option></select></label><button id="hneu">Nachricht schreiben</button></div>
  <div class="klein leise" id="hgeb" style="margin-top:6px"></div>
  <div style="margin-top:12px"><textarea id="ht" rows="5" placeholder="Hier erscheint die Nachricht an den Verkäufer – du kannst sie ändern.">${esc(alt?alt.text:'')}</textarea></div>
  <div class="reihe"><button class="haupt" id="hkop" style="padding:9px 16px">Kopieren und Angebot öffnen</button><span class="leise klein">Dann beim Verkäufer einfügen (⌘V) und senden – das Senden bleibt bei dir.</span></div>
  <div style="margin-top:18px;border-top:1px solid var(--linie);padding-top:14px"><b>Verkäufer hat geantwortet?</b> <span class="leise klein">Antwort hier einfügen – du bekommst einen Vorschlag.</span>
  <textarea id="ha" rows="3" style="margin-top:8px" placeholder="Antwort des Verkäufers"></textarea>
  <div class="reihe"><button id="hant">Antwort vorschlagen</button><span id="hlage"></span></div>
  <textarea id="hr" rows="4" style="margin-top:8px;display:none"></textarea>
  <div class="reihe" id="hrk" style="display:none"><button id="hrkop">Antwort kopieren und Angebot öffnen</button></div></div>
  <div class="kasten" style="margin-top:14px;border-color:var(--akzent)"><b>Selbstständig verhandeln lassen</b> <span id="hkonto" class="leise klein">– prüfe Konto …</span>
  <div class="klein leise" style="margin:6px 0">Die App sendet die Nachricht oben über dein Kleinanzeigen-Konto, liest die Antworten, bleibt bei deinem Preis (höchstens 3 Gegenrunden) und meldet sich per Telegram, sobald ihr euch einig seid, der Verkäufer etwas fragt oder etwas nach Betrug aussieht. Abholung und Bezahlung machst du.</div>
  <button class="haupt" id="hauto" style="padding:9px 16px" disabled>Selbstständig verhandeln</button> <span id="hautoinfo" class="klein"></span></div>
  <div class="reihe" style="justify-content:flex-end"><button id="hzu">Schließen</button></div>`;
  $('#dlg').showModal(); if(!alt&&akt.mein) entwurf();
  const istKA=(a.url||'').includes('kleinanzeigen.de/s-anzeige/');
  if(!istKA){ $('#hkonto').textContent='– nur bei Kleinanzeigen-Angeboten möglich.'; }
  else fetch('/api/konto').then(r=>r.json()).then(k=>{ const el=$('#hkonto'); if(el){ el.textContent='– '+k.hinweis; $('#hauto').disabled=!k.bereit; } }).catch(()=>{});
}
$('#dlg').addEventListener('click',async e=>{
  if(e.target.id==='hzu'||e.target===$('#dlg')){ $('#dlg').close(); return; }
  if(e.target.id==='hneu'){ entwurf(); return; }
  if(e.target.id==='hauto'){ const text=$('#ht').value.trim(), m=parseFloat($('#hp').value)||0; if(!text||text==='Schreibe …'||!m){ $('#hautoinfo').textContent='Erst deinen Preis eintragen und die Nachricht schreiben lassen.'; return; }
    e.target.disabled=true; $('#hautoinfo').textContent='Starte …';
    const d=await post('/api/auto/start',{url:akt.a.url,titel:akt.a.titel,preis:akt.a.preis,mein:m,weg:$('#hweg').value,text});
    if(d.fehler){ $('#hautoinfo').innerHTML='<span style="color:var(--rot)">'+esc(d.fehler)+'</span>'; e.target.disabled=false; } else { $('#hautoinfo').textContent='Läuft – die Nachricht wird jetzt gesendet. Stand unter „Selbstständige Verhandlungen“.'; autoliste(d); }
    return; }
  const merk=stand=>post('/api/verhandlung',{url:akt.a.url,titel:akt.a.titel,quelle:akt.a.quelle,preis:akt.a.preis,mein:akt.mein||parseFloat($('#hp').value)||0,stand,text:$('#ht').value}).then(handelsliste);
  if(e.target.id==='hkop'){ if(!$('#ht').value.trim()||$('#ht').value==='Schreibe …') return; kopieren($('#ht').value); merk('Nachricht kopiert – wartet auf Antwort'); window.open(akt.a.url,'_blank'); e.target.textContent='Kopiert ✓ – Angebot geöffnet'; return; }
  if(e.target.id==='hant'){ const t=$('#ha').value.trim(); if(!t) return; $('#hlage').textContent='Lese …';
    const d=await post('/api/antwort',{titel:akt.a.titel,preis:akt.a.preis,mein:akt.mein||parseFloat($('#hp').value)||0,antwort:t,weg:$('#hweg').value});
    if(d.lage==='betrugsverdacht'){ $('#hlage').innerHTML=`<b style="color:var(--rot)">⚠ Betrugsverdacht – nicht bezahlen, nichts anklicken</b><div class="klein" style="color:var(--rot);flex-basis:100%">${(d.warn||[]).map(esc).join(' · ')}</div>`; $('#hr').style.display='block'; $('#hrk').style.display='flex'; $('#hr').value=d.antwort||''; merk('⚠ BETRUGSVERDACHT'); return; }
    const L={einig:'✓ Einig – Verkäufer nimmt deinen Preis an. Den Abschluss machst du.',gegenangebot:'Gegenangebot'+(d.preis_verkaeufer?' '+eur(d.preis_verkaeufer):''),abgelehnt:'Abgelehnt',rueckfrage:'Rückfrage des Verkäufers',unklar:'Nicht eindeutig'};
    $('#hlage').innerHTML=`<b>${L[d.lage]||L.unklar}</b>`; $('#hr').style.display='block'; $('#hrk').style.display='flex'; $('#hr').value=d.antwort||''; merk(d.lage==='einig'?'EINIG – Abschluss durch dich':(L[d.lage]||'Antwort erhalten')); return; }
  if(e.target.id==='hrkop'){ kopieren($('#hr').value); window.open(akt.a.url,'_blank'); e.target.textContent='Kopiert ✓'; }
});
zeigen(); merkliste(); handelsliste(); abholzeile(); autoliste();
const vor=new URLSearchParams(location.search).get('q'); if(vor) suchen(vor);
// Zurück an den Anfang und Schließen – immer erreichbar, auch in langen Listen
document.addEventListener('click',e=>{ const z=e.target.closest('[data-dzu],[data-anfang],#hoch'); if(!z) return;
  const d=z.closest('dialog');
  if(z.dataset.dzu){ d.close(); return; }
  if(d) d.scrollTo({top:0,behavior:'smooth'}); else window.scrollTo({top:0,behavior:'smooth'}); });
addEventListener('scroll',()=>$('#hoch').classList.toggle('da',scrollY>500),{passive:true});
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('scroll',()=>d.querySelector('.hoch').classList.toggle('da',d.scrollTop>500),{passive:true}));
</script>
</body>
</html>
