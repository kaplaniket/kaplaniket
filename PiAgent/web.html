<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PiAgent</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --fg:#1d1d1b; --muted:#77756f; --accent:#c51a4a; --line:#e3e1dc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --card:#222220; --fg:#ecebe7; --muted:#9a988f; --line:#33322f; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif;
         display:flex; flex-direction:column; height:100vh; height:100dvh; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; }
  header b { color:var(--accent); }
  header button { margin-left:auto; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--accent); color:#fff; }
  .bot { align-self:flex-start; background:var(--card); border:1px solid var(--line); }
  .tool { align-self:flex-start; font:12px ui-monospace, monospace; color:var(--muted); }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  input { flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
          background:var(--card); color:var(--fg); font:inherit; }
  button { padding:10px 14px; border-radius:10px; border:0; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; }
</style>
</head>
<body>
<header><b>●</b> PiAgent <button id="reset" type="button">Neuer Chat</button></header>
<div id="log"></div>
<form id="f"><input id="q" placeholder="Frag deinen Pi…" autocomplete="off" autofocus><button id="send">Senden</button></form>
<script>
const log = document.getElementById('log'), q = document.getElementById('q'), send = document.getElementById('send');
function add(cls, text) {
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const text = q.value.trim(); if (!text) return;
  q.value = ''; add('user', text); send.disabled = true;
  const wait = add('bot', '…');
  try {
    const r = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message: text})});
    const data = await r.json();
    wait.remove();
    (data.tools || []).forEach(t => add('tool', '↳ ' + t.name + ' ' + JSON.stringify(t.args)));
    add('bot', data.reply || ('Fehler: ' + data.error));
  } catch (err) { wait.textContent = 'Fehler: ' + err; }
  send.disabled = false; q.focus();
};
document.getElementById('reset').onclick = async () => {
  await fetch('/api/reset', {method:'POST'}); log.innerHTML = '';
};
</script>
</body>
</html>
